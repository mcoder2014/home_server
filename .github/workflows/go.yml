name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.21.12'

    - name: Check public deployment examples
      run: python3 script/check_public_deployment.py

    - name: Build
      run: go build -v ./...

    - name: Test offline packages
      # DAL/RPC/DDNS and device tests need an explicitly isolated integration environment.
      env:
        HOME_SERVER_LOG_FILE: ${{ runner.temp }}/home_server_test.log
      run: go test -v ./api/webprojects ./api/applications ./api/auth ./api/middleware ./app/... ./domain/model ./domain/repository/... ./domain/service/webprojects ./domain/service/applications ./domain/service/passport ./domain/service/rsa ./utils ./utils/md ./utils/log ./utils/ginfmt

    - name: Test AI API client
      run: python3 script/test_home_server_api.py -v
