# Example only: documentation IPs and example.com must be replaced in an untracked local copy.
# Independent Nginx instance; does not load /etc/nginx/nginx.conf or test sites.
worker_processes auto;
pid /run/home_server_frontend/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    # Only the gateway may assert HTTPS. A direct LAN client cannot spoof it.
    map "$remote_addr:$http_x_forwarded_proto" $cq_forwarded_proto {
        "192.0.2.20:https" https;
        default $scheme;
    }
    map $remote_addr $cq_client_ip {
        192.0.2.20 $http_x_forwarded_for;
        default $remote_addr;
    }
    client_body_temp_path /run/home_server_frontend/body;
    proxy_temp_path /run/home_server_frontend/proxy;
    fastcgi_temp_path /run/home_server_frontend/fastcgi;
    uwsgi_temp_path /run/home_server_frontend/uwsgi;
    scgi_temp_path /run/home_server_frontend/scgi;
    server {
        listen 192.0.2.10:18081;
        server_name _;
        root /opt/home_server/current/frontend;
        index index.html;
        # Installed copies of the repo's API snippets use
        # $cq_forwarded_proto and $cq_client_ip in proxy headers.
        # api_auth_locations also routes /api/site/, /api/account/ and /api/admin/;
        # keep these specific locations ahead of the generic /api/ rejection.
        include /etc/home_server/locations/web_projects_locations.conf;
        include /etc/home_server/locations/api_auth_locations.conf;
        include /etc/home_server/locations/manuals_locations.conf;
        include /etc/home_server/locations/file_sharing_locations.conf;
        location ^~ /passport/ {
            client_max_body_size 16k;
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $cq_forwarded_proto;
            proxy_set_header X-Forwarded-For $cq_client_ip;
            proxy_cache off;
        }
        location = /ping {
            proxy_pass http://127.0.0.1:18080;
        }
        location = /api { return 404; }
        location /api/ { return 404; }
        location = /p { return 404; }
        location ^~ /s/ {
            access_log off;
            error_log /dev/null;
            try_files /index.html =404;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
