# Example only: documentation IPs and example.com must be replaced in an untracked local copy.
# Install in a locally selected frontend site on the configured TLS gateway.
server {
    listen 8080 ssl;
    # Optional second hostname; the certificate must cover every name.
    server_name home.example.com home.internal.example.com;
    ssl_certificate /etc/letsencrypt/live/home.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 409600m;
    access_log off;

    if ($request_uri ~* "^/(?:p|%70)(?:%2f|/[^?]*(?:%2f|%5c|%00))") {
        return 400;
    }
    if ($request_uri ~* "^/(?:p|%70)/(?:[^?]*/)?(?:[.]|%2e)(?:[.]|%2e)(?:/|[?]|$)") {
        return 400;
    }

    # Keep only the new account namespaces on a bounded, uncached API route.
    # Preserve the existing gateway destination and raw Host (including port).
    location = /api/account/avatar {
        client_max_body_size 3m;
        proxy_pass http://192.0.2.10:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/(site|account|admin)/ {
        client_max_body_size 64k;
        proxy_pass http://192.0.2.10:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # Keep authentication input bounded before JSON and RSA processing upstream.
    location ~ ^/(?:passport/login|api/auth/(?:login|register|invitations/validate|token))$ {
        client_max_body_size 16k;
        proxy_pass http://192.0.2.10:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://192.0.2.10:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
