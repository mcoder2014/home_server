# Example only: documentation IPs and example.com must be replaced in an untracked local copy.
# 192.0.2.20: preserve the legacy API endpoint and fix trusted TLS metadata.
server {
    listen 18080 ssl;
    server_name home.example.com;
    ssl_certificate /etc/letsencrypt/live/home.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 409600m;
    access_log off;

    if ($request_uri ~* "^/(?:p|%70)(?:%2f|/[^?]*(?:%2f|%5c|%00))") {
        return 400;
    }
    if ($request_uri ~* "^/(?:p|%70)/(?:[^?]*/)?(?:[.]|%2e)(?:[.]|%2e)(?:/|[?]|$)") {
        return 400;
    }

    location / {
        proxy_pass http://192.0.2.10:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
