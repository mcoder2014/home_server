# Existing installations keep file identities until the reviewed accounts
# migration succeeds. Database mode requires both sources to be database.
identity_source: config
config_source: file
# Verified hard ceiling of every proxy upload path; 50 MiB in this example.
upload_hard_limit_bytes: 52428800
server:
  # http server 的服务端口
  port: 8080
rpc:
  jmisbn:
    # 云市场的接口 https://market.aliyun.com/products/57126001/cmapi00053669.html?spm=5176.730005.result.6.f32d3524quBk45&innerSource=search_isbn#sku=yuncode4766900001
    app_code: "" # Set privately; never commit a real AppCode.
  cloudflare:
    api_key: xxxx
    zone_id: xxxx
    account_id: xxxx
mysql:
  master_db: test:123456@tcp(127.0.0.1:3306)/home_server?charset=utf8mb4&parseTime=True&loc=Local
passport:
  mock_data: '[{"id":123,"user_name":"test","password":"$2a$04$R2Csdr0qO4JEHxawUyysM.xiv266hVHiNh.hoUCAwpNObRFMyisE6","email":"m123@123.com","mobile":"12345678901","create_time":"0001-01-01T00:00:00Z","update_time":"0001-01-01T00:00:00Z"}]'
  redirect_login_path: https://example.com/login
webdav:
  share_path: ./share
web_projects:
  # Keep disabled until the migration, private storage directory and same-origin proxy are ready.
  enabled: false
  # New files: <storage_root>/<owner_user_id>/upload/html/<project_id>/releases/<release_id>/content
  storage_root: /var/lib/home_server/web-projects
  site_origin: https://home.example.com
  max_upload_bytes: 52428800
  max_expanded_bytes: 209715200
  max_file_bytes: 52428800
  max_file_count: 5000
  max_directory_depth: 16
  max_project_bytes: 1073741824
  max_releases: 10
  max_concurrent_uploads_per_user: 2
  max_concurrent_extracts: 4
  delete_retention_days: 7

manuals:
  # Keep disabled until the migration and private storage directory are ready.
  enabled: false
  storage_root: /var/lib/home_server/manuals
  max_file_bytes: 52428800
  max_items_per_manual: 100
  max_manual_bytes: 524288000
  max_manuals_per_user: 1000
  max_user_bytes: 10737418240
  min_free_disk_bytes: 2147483648
  pdftoppm_path: /usr/bin/pdftoppm
  prlimit_path: /usr/bin/prlimit
  pdf_preview_timeout_seconds: 10
  max_concurrent_pdf_previews: 1
  pdf_preview_memory_limit_bytes: 536870912
  pdf_preview_cpu_seconds: 10
  pdf_preview_output_limit_bytes: 16777216
  pdf_preview_open_files_limit: 32

auth:
  # Enable after application tables and same-origin HTTPS proxy are installed.
  applications_enabled: false
  # Set the actual HTTPS origin; an enabled web_projects origin is reused when empty.
  site_origin: ''
  # Additional exact HTTPS origins allowed to create browser sessions.
  site_origins: []
  token_ttl_seconds: 900
  default_credential_ttl_days: 90
  max_credential_ttl_days: 365
  max_applications_per_user: 20
  # Trust forwarded HTTPS only from these backend-facing proxy addresses.
  trusted_proxy_cidrs:
    - 127.0.0.1/32
    - ::1/128

# Optional, disposable read caches. Redis unavailability falls back to MySQL.
# Do not expose Redis on the public network or place credentials in this example.
redis:
  enabled: false
  address: '127.0.0.1:6379'
  db: 0
  username: ''
  password_file: ''
  key_prefix: 'hs:prod'
  dial_timeout_ms: 200
  command_timeout_ms: 20
  pool_size: 8
cache:
  enabled: false
  namespaces: [book, book_address, web_release, app_token]
analytics:
  # Requires the additive stats migration and a private HMAC key. Redis scripts
  # are never used; evicted working data is restored from the latest SQL snapshot.
  # Read docs/redis-cache-analytics.md before enabling. No startup DDL is run.
  enabled: false
  timezone: 'Asia/Shanghai'
  retention_days: 90
  hot_days: 3
  flush_interval_seconds: 60
  queue_size: 4096
  visitor_hmac_key_file: ''
