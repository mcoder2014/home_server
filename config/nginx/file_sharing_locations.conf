# Every file API request goes through the backend. Never add a static alias for
# file_sharing.storage_root; share tokens and private storage paths are secrets.
location = /api/files {
    access_log off;
    client_max_body_size 52m;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/files/ {
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/file-shares/ {
    # Tokens must not enter access logs. Buffering is disabled so committed
    # downloads stream from the backend without a second resumable copy.
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}
