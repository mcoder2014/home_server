# All manual metadata, originals and thumbnails go through backend authorization.
# Do not add a static alias for manuals.storage_root.
location = /api/manuals {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/manuals/ {
    # 50 MiB file limit plus multipart overhead; the application checks each body.
    client_max_body_size 52m;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}
