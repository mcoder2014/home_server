# Include this file inside the existing HTTPS server block that serves front_vue.
# Change the upstream address once if home_server is not on localhost:18080.
# Keep the full request URI: every /p/ request must pass through backend authorization.

# These guards run before location selection. Nginx otherwise normalizes dot segments
# and can send a rejected project path to the management SPA fallback.
# Only inspect the path portion; encoded values in the query string remain valid.
if ($request_uri ~* "^/(?:p|%70)(?:%2f|/[^?]*(?:%2f|%5c|%00))") {
    return 400;
}
if ($request_uri ~* "^/(?:p|%70)/(?:[^?]*/)?(?:[.]|%2e)(?:[.]|%2e)(?:/|[?]|$)") {
    return 400;
}

location = /api/web-projects {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}

location ^~ /api/web-projects/ {
    # The application separately enforces its configured upload limit.
    client_max_body_size 51m;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}

location ^~ /p/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}
