# Include inside the HTTPS server serving front_vue. These fixed API routes
# must reach home_server even when the optional application module is disabled.
# Configure auth.trusted_proxy_cidrs for this proxy's backend-facing address.
location ^~ /api/auth/ {
    # Rejected credential queries must not enter proxy access logs. The app logs a redacted URI.
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}

location = /api/applications {
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}

location ^~ /api/applications/ {
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}

# Expose the existing authenticated APIs at the same origin for API clients.
# Their user/Basic behavior remains in home_server; Bearer apps additionally
# require the corresponding library or WebDAV scope.
location ~ ^/(library|bookinfo|webdav|webdav_dev)/ {
    client_max_body_size 409600m;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_intercept_errors off;
}
